<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>TaskFlow Dashboard</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-task.html">Add Task</a>
            <a href="task-list.html">Task List</a>
            <a href="task-detail.html">Task Detail</a>
            <a href="about.html">About</a>
        </nav>
        <h2 id="dashboard-stats">Welcome Back</h2>
        <p>Here is the current status of your project workspace.</p>
        <table>
            <tr>
                <th>Total Tasks</th>
                <th>Pending</th>
                <th>Completed</th>
            </tr>
            <tr>
                <td><strong id="total-tasks">12</strong></td>
                <td><strong id="pending-tasks">8</strong></td>
                <td><strong id="completed-tasks">4</strong></td>
            </tr>
        </table>

        <h2 style="margin-top: 2.5rem;">High Priority & Upcoming Tasks</h2>
        <ul id="upcoming-tasks" class="dashboard-list">
            <!-- Populated dynamically via JS -->
        </ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
