<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow | Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Directory</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-task.html">Add Task</a>
            <a href="task-list.html">Task List</a>
            <a href="task-detail.html">Task Detail</a>
            <a href="about.html">About</a>
        </nav>
        <div style="margin-bottom: 1rem; display: flex; gap: 0.5rem;">
            <button id="filter-all">All</button>
            <button id="filter-pending">Pending</button>
            <button id="filter-completed">Completed</button>
        </div>
        <table id="task-list-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Due Date</th>
                    <th>Priority</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="task-list-body">
                <!-- Tasks will be populated dynamically -->
            </tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
