<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow | Add Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Add New Task</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-task.html">Add Task</a>
            <a href="task-list.html">Task List</a>
            <a href="task-detail.html">Task Detail</a>
            <a href="about.html">About</a>
        </nav>
        <form id="add-task-form">
            <div class="form-group">
                <label for="task-title">Task Title</label>
                <input type="text" id="task-title" placeholder="Enter task name" required>
            </div>
            <div class="form-group">
                <label for="task-desc">Description</label>
                <textarea id="task-desc" rows="4" placeholder="Task details..."></textarea>
            </div>
            <div class="form-group">
                <label for="task-due">Due Date</label>
                <input type="date" id="task-due" required>
            </div>
            <div class="form-group">
                <label for="task-priority">Priority</label>
                <select id="task-priority">
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>
            <button type="submit">Create Task</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
