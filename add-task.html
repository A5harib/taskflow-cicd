<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow | Add Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Add New Task</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-task.html">Add Task</a>
            <a href="task-list.html">Task List</a>
            <a href="task-detail.html">Task Detail</a>
            <a href="about.html">About</a>
        </nav>
        <form>
            <div class="form-group">
                <label>Task Title</label>
                <input type="text" placeholder="Enter task name" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea rows="4" placeholder="Task details..."></textarea>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" required>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>
            <button type="button">Create Task</button>
        </form>
    </div>
</body>
</html>
